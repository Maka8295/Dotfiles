# dungeonOS theme for yazi: same palette as nvim, waybar, rofi and btop.
# Only colours are set here; yazi fills in everything else (icons etc.) from its own theme.
#
# bg #1A1816  surface #24201C  band #463D34  border #7E705D
# fg #C8B8A0  muted #9D8E7C  comment #6F675E
# moss #6E7F5A  sage #879376  brass #A88A5B  clay #7A5E47  steel #8F8B81  rust #7B4A3E

[mgr]
cwd = { fg = "#A88A5B", bold = true }

find_keyword  = { fg = "#A88A5B", bold = true, underline = true }
find_position = { fg = "#879376", bold = true }

symlink_target = { fg = "#9D8E7C", italic = true }

marker_copied   = { fg = "#6E7F5A", bg = "#6E7F5A" }
marker_cut      = { fg = "#7B4A3E", bg = "#7B4A3E" }
marker_marked   = { fg = "#8F8B81", bg = "#8F8B81" }
marker_selected = { fg = "#A88A5B", bg = "#A88A5B" }

count_copied   = { fg = "#1A1816", bg = "#6E7F5A" }
count_cut      = { fg = "#C8B8A0", bg = "#7B4A3E" }
count_selected = { fg = "#1A1816", bg = "#A88A5B" }

border_symbol = "│"
border_style  = { fg = "#7E705D" }

[tabs]
active   = { fg = "#1A1816", bg = "#A88A5B", bold = true }
inactive = { fg = "#9D8E7C", bg = "#463D34" }

[mode]
normal_main = { fg = "#1A1816", bg = "#A88A5B", bold = true }
normal_alt  = { fg = "#A88A5B", bg = "#463D34" }
select_main = { fg = "#C8B8A0", bg = "#7B4A3E", bold = true }
select_alt  = { fg = "#C8B8A0", bg = "#463D34" }
unset_main  = { fg = "#C8B8A0", bg = "#7A5E47", bold = true }
unset_alt   = { fg = "#C8B8A0", bg = "#463D34" }

# hovered file: the bronze band, like rofi's selected row
[indicator]
parent  = { fg = "#C8B8A0", bg = "#24201C" }
current = { fg = "#C8B8A0", bg = "#463D34", bold = true }
preview = { underline = true }

[status]
perm_sep   = { fg = "#6F675E" }
perm_type  = { fg = "#6E7F5A" }
perm_read  = { fg = "#A88A5B" }
perm_write = { fg = "#7B4A3E" }
perm_exec  = { fg = "#879376" }

progress_label  = { fg = "#C8B8A0", bold = true }
progress_normal = { fg = "#6E7F5A", bg = "#24201C" }
progress_error  = { fg = "#C8B8A0", bg = "#7B4A3E" }

[which]
border          = { fg = "#7E705D" }
cand            = { fg = "#A88A5B" }
rest            = { fg = "#6F675E" }
desc            = { fg = "#879376" }
separator_style = { fg = "#6F675E" }

[confirm]
border = { fg = "#7E705D" }
title  = { fg = "#A88A5B" }

[spot]
border   = { fg = "#7E705D" }
title    = { fg = "#A88A5B" }
tbl_col  = { fg = "#A88A5B" }
tbl_cell = { fg = "#1A1816", bg = "#A88A5B" }

[notify]
title_info  = { fg = "#6E7F5A" }
title_warn  = { fg = "#A88A5B" }
title_error = { fg = "#7B4A3E" }

[pick]
border = { fg = "#7E705D" }
active = { fg = "#A88A5B", bold = true }

[input]
border   = { fg = "#7E705D" }
title    = { fg = "#A88A5B" }
selected = { bg = "#463D34" }

[cmp]
border = { fg = "#7E705D" }
active = { bg = "#463D34" }

[tasks]
border  = { fg = "#7E705D" }
title   = { fg = "#A88A5B" }
hovered = { fg = "#A88A5B", bold = true }

[help]
border  = { fg = "#7E705D" }
chord   = { fg = "#A88A5B" }
hovered = { bg = "#463D34", bold = true }

[filetype]
rules = [
	# Image
	{ mime = "**/image/*", fg = "#B99A80" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "#879376" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#985747" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#8F8B81" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#6F675E" },
	# Special file
	{ url = "*", is = "orphan", bg = "#7B4A3E" },
	{ url = "*", is = "exec"  , fg = "#6E7F5A" },
	# Dummy file
	{ url = "*", is = "dummy", bg = "#7B4A3E" },
	{ url = "*/", is = "dummy", bg = "#7B4A3E" },
	# Folders
	{ url = "*/", fg = "#A88A5B", bold = true }
]

