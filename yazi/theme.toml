
[manager]
cwd = { fg = "#A88A5B" }

hovered         = { fg = "#DDD0BD", bg = "#3A332C", bold = false }
preview_hovered = { fg = "#DDD0BD", bg = "#3A332C" }

find_keyword  = { fg = "#A88A5B", bold = true }
find_position = { fg = "#879376", bold = true }

marker_copied   = { fg = "#879376", bg = "#879376" }
marker_cut      = { fg = "#7B4A3E", bg = "#7B4A3E" }
marker_marked   = { fg = "#A88A5B", bg = "#A88A5B" }
marker_selected = { fg = "#6E7F5A", bg = "#6E7F5A" }

tab_active   = { fg = "#1A1816", bg = "#A88A5B", bold = true }
tab_inactive = { fg = "#9D8E7C", bg = "#24201C" }

count_copied   = { fg = "#1A1816", bg = "#879376" }
count_cut      = { fg = "#1A1816", bg = "#7B4A3E" }
count_selected = { fg = "#1A1816", bg = "#A88A5B" }

border_symbol = "│"
border_style  = { fg = "#6F6252" }

syntect_theme = ""

[status]
separator_open  = ""
separator_close = ""

perm_type  = { fg = "#879376" }
perm_read  = { fg = "#C8B8A0" }
perm_write = { fg = "#A88A5B" }
perm_exec  = { fg = "#6E7F5A" }
perm_sep   = { fg = "#6F675E" }

progress_label  = { fg = "#DDD0BD", bold = true }
progress_normal = { fg = "#6E7F5A", bg = "#24201C" }
progress_error  = { fg = "#7B4A3E", bg = "#24201C" }

[pick]
border   = { fg = "#6F6252" }
active   = { fg = "#A88A5B", bold = true }
inactive = { fg = "#9D8E7C" }

[input]
border   = { fg = "#6F6252" }
title    = { fg = "#A88A5B" }
value    = { fg = "#C8B8A0" }
selected = { bg = "#3A332C" }

[completion]
border = { fg = "#6F6252" }

active   = { bg = "#3A332C", fg = "#DDD0BD" }
inactive = { fg = "#9D8E7C" }

[tasks]
border  = { fg = "#6F6252" }
title   = { fg = "#A88A5B" }
hovered = { fg = "#DDD0BD", bg = "#3A332C" }

[which]
cols            = 3
mask            = { bg = "#141210" }
cand            = { fg = "#879376" }
rest            = { fg = "#9D8E7C" }
desc            = { fg = "#C8B8A0" }
separator       = "  "
separator_style = { fg = "#6F675E" }

[help]
on      = { fg = "#879376" }
exec    = { fg = "#A88A5B" }
desc    = { fg = "#C8B8A0" }
hovered = { bg = "#3A332C", bold = false }
footer  = { fg = "#6F675E", bg = "#141210" }

[filetype]
rules = [
    { mime = "image/*", fg = "#879376" },
    { mime = "video/*", fg = "#7A5E47" },
    { mime = "audio/*", fg = "#A88A5B" },
    { mime = "application/*", fg = "#8F8B81" },

    { name = "*", is = "dir", fg = "#6E7F5A" },
    { name = "*", is = "link", fg = "#8F8B81" },
    { name = "*", is = "exec", fg = "#A88A5B" },
]
