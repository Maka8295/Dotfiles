# hyprlock: the dungeonOS lock screen (matches the SDDM login screen in ~/Dotfiles/sddm).
# Locks via Super+L, hypridle, or before any sleep.

general {
    hide_cursor = false
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Dotfiles/wallpapers/cambridge.jpg
    blur_passes = 0
}

# framed panel: 1px bronze line, 3px band, like waybar and the windows
shape {
    monitor =
    size = 460, 400
    color = rgb(1A1816)
    rounding = 0
    border_size = 1
    border_color = rgb(7E705D)
    position = 0, 0
    halign = center
    valign = center
}
shape {
    monitor =
    size = 458, 398
    color = rgba(00000000)
    rounding = 0
    border_size = 3
    border_color = rgb(463D34)
    position = 0, 0
    halign = center
    valign = center
}

# clock and date in brass CloisterBlack, like the login screen
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(A88A5B)
    font_size = 72
    font_family = CloisterBlack   # no space: Pango reads "Cloister Black" as font "Cloister", weight Black
    position = 0, 95
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgb(9D8E7C)
    font_size = 21
    font_family = CloisterBlack   # no space: Pango reads "Cloister Black" as font "Cloister", weight Black
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 52
    outline_thickness = 1
    outer_color = rgb(463D34)
    inner_color = rgb(141210)
    font_color = rgb(C8B8A0)
    font_family = CloisterBlack   # no space: Pango reads "Cloister Black" as font "Cloister", weight Black
    check_color = rgb(A88A5B)
    fail_color = rgb(7B4A3E)
    fail_text = Login failed
    placeholder_text = <span foreground="##6F675E">Password</span>
    rounding = 0
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
    position = 0, -70
    halign = center
    valign = center
}
