# hypridle: locks before every sleep (sleep button, lid, power key, idle) and handles idle.
# Started from hyprland.lua.

general {
    lock_cmd = pidof hyprlock || hyprlock                      # one lock screen only
    before_sleep_cmd = loginctl lock-session                   # lock BEFORE sleeping
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'   # screen back on after waking
}

# lock after 10 minutes idle
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# screen off a minute later, back on with any key or mouse movement
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# laptop only (a battery is present): sleep after 30 minutes idle
listener {
    timeout = 1800
    on-timeout = ls /sys/class/power_supply/BAT* >/dev/null 2>&1 && systemctl suspend
}
